          arabic: "قُلْ هُوَ اللهُ أَحَدٌ... (٣×)\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ... (٣×)\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ... (٣×)",
          translation: "Membaca Surat Al-Ikhlash, Al-Falaq, dan An-Naas masing-masing 3 kali.",
          defaultTarget: 3,
          note: "Dibaca 3x."
        },
        {
          id: "pt_3",
          title: "Amsayna wa Amsal Mulku Lillah",
          arabic: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ، وَخَيْرَ مَا بَعْدَهَا، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوْءِ الْكِبَرِ، رَبِّ أَعُوْذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",
          translation: "Kami telah memasuki waktu sore dan kerajaan hanya milik Allah...",
          defaultTarget: 1,
          note: "Dibaca 1x."
        },
        {
          id: "pt_4",
          title: "Allahumma Bika Amsayna",
          arabic: "اَللَّهُمَّ بِكَ أَمْسَيْنَا ، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا ، وَبِكَ نَمُوْتُ وَإِلَيْكَ الْمَصِيرُ.",
          translation: "Ya Allah, dengan pertolongan dan rahmat-Mu kami masuk waktu sore... dan kepada-Mu tempat kembali.",
          defaultTarget: 1,
          note: "Dibaca 1x."
        },
        {
          id: "pt_5",
          title: "Sayyidul Istighfar",
          arabic: "اَللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوْءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ.",
          translation: "Ya Allah, Engkau adalah Rabb-ku, tidak ada Ilah selain Engkau...",
          defaultTarget: 1,
          note: "Dibaca 1x."
        },
        {
          id: "pt_6",
          title: "Perlindungan Dari Kejahatan Makhluk",
          arabic: "أَعُوْذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.",
          translation: "Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari kejahatan makhluk yang diciptakan-Nya.",
          defaultTarget: 3,
          note: "Dibaca 3x khusus di waktu petang."
        },
        {
          id: "pt_7",
          title: "Bismillahilladhi Laa Yadhurru",
          arabic: "بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",
          translation: "Dengan nama Allah yang bila disebut, segala sesuatu di bumi dan langit tidak akan berbahaya...",
          defaultTarget: 3,
          note: "Dibaca 3x."
        },
        {
          id: "pt_8",
          title: "Radhiitu Billahi Rabba",
          arabic: "رَضِيْتُ بِاللهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.",
          translation: "Aku rela Allah sebagai Rabb, Islam sebagai agama, dan Muhammad SAW sebagai Nabi.",
          defaultTarget: 3,
          note: "Dibaca 3x."
        },
        {
          id: "pt_9",
          title: "Subhanallahi wa Bihamdihi",
          arabic: "سُبْحَانَ اللهِ وَبِحَمْدِهِ.",
          translation: "Mahasuci Allah, aku memuji-Nya.",
          defaultTarget: 100,
          note: "Dibaca 100x."
        },
        {
          id: "pt_10",
          title: "Shalawat Nabi",
          arabic: "اَللَّهُمَّ صَلِّ وَسَلَّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ.",
          translation: "Ya Allah, limpahkanlah shalawat dan salam kepada Nabi kami Muhammad.",
          defaultTarget: 10,
          note: "Dibaca 10x di waktu petang."
        }
      ]
    };

    // State Management
    let currentTab = localStorage.getItem('dzikir_active_tab') || 'shalat';
    let userCounts = JSON.parse(localStorage.getItem('dzikir_counts') || '{}');
    let userTargets = JSON.parse(localStorage.getItem('dzikir_targets') || '{}');

    // Speech Synthesis setup
    const synth = window.speechSynthesis;

    function saveState() {
      localStorage.setItem('dzikir_active_tab', currentTab);
      localStorage.setItem('dzikir_counts', JSON.stringify(userCounts));
      localStorage.setItem('dzikir_targets', JSON.stringify(userTargets));
      updateOverallProgress();
    }

    function getTarget(item) {
      return userTargets[item.id] !== undefined ? parseInt(userTargets[item.id]) : item.defaultTarget;
    }

    function getCount(item) {
      return userCounts[item.id] || 0;
    }

    function increment(id, target) {
      const current = userCounts[id] || 0;
      if (current < target) {
        userCounts[id] = current + 1;
        saveState();
        render();
      }
    }

    function resetSingle(id) {
      userCounts[id] = 0;
      saveState();
      render();
    }

    function changeTarget(id, newTarget) {
      const val = parseInt(newTarget);
      if (!isNaN(val) && val > 0) {
        userTargets[id] = val;
        if ((userCounts[id] || 0) > val) {
          userCounts[id] = val;
        }
        saveState();
        render();
      }
    }

    function speakArabic(text) {
      if (!synth) return;
      synth.cancel(); // stop active audio
      const cleanText = text.replace(/\(.\times\)/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.85;
      synth.speak(utterance);
    }

    function switchTab(tab) {
      currentTab = tab;
      saveState();
      render();
    }

    function updateOverallProgress() {
      const items = dzikirData[currentTab];
      let totalCompleted = 0;
      items.forEach(item => {
        const count = getCount(item);
        const target = getTarget(item);
        if (count >= target) totalCompleted++;
      });
      const pct = Math.round((totalCompleted / items.length) * 100);
      document.getElementById('overallProgressBar').style.width = pct + '%';
    }

    function render() {
      // Update Tab Styles
      ['shalat', 'pagi', 'petang'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === currentTab) {
          btn.className = "flex-1 py-3 text-center transition border-b-2 border-emerald-300 text-white font-bold bg-emerald-700/50";
        } else {
          btn.className = "flex-1 py-3 text-center transition border-b-2 border-transparent text-emerald-100 hover:text-white hover:bg-emerald-700/30";
        }
      });

      const container = document.getElementById('dzikirContainer');
      container.innerHTML = '';

      const items = dzikirData[currentTab];

      items.forEach(item => {
        const count = getCount(item);
        const target = getTarget(item);
        const isDone = count >= target;

        const card = document.createElement('div');
        card.className = `bg-white rounded-xl shadow-sm border transition-all duration-200 p-5 ${
          isDone ? 'border-emerald-500 bg-emerald-50/30' : 'border-slate-200 hover:border-slate-300'
        }`;

        card.innerHTML = `
          <!-- Header & Target Settings -->
          <div class="flex items-start justify-between gap-2 mb-3">
            <div>
              <h3 class="font-semibold text-slate-800 text-base flex items-center gap-2">
                ${item.title}
                ${isDone ? '<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-medium">Selesai</span>' : ''}
              </h3>
              <p class="text-xs text-slate-500 mt-0.5">${item.note}</p>
            </div>
            
            <!-- Target Setting & Audio Button -->
            <div class="flex items-center gap-2">
              <button onclick="speakArabic(\`${item.arabic}\`)" title="Dengarkan Pelafalan" class="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
              </button>
              <div class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-lg text-xs font-medium text-slate-600">
                <label for="target-${item.id}" class="text-slate-400">Target:</label>
                <input id="target-${item.id}" type="number" min="1" value="${target}" onchange="changeTarget('${item.id}', this.value)" class="w-12 bg-white border border-slate-300 rounded px-1 text-center font-bold text-slate-700 focus:outline-none focus:border-emerald-500">
              </div>
            </div>
          </div>

          <!-- Arabic Text -->
          <div class="font-arabic text-right text-2xl md:text-3xl text-slate-800 mb-3 leading-loose" dir="rtl">
            ${item.arabic}
          </div>

          <!-- Translation -->
          <p class="text-xs md:text-sm text-slate-600 mb-4 leading-relaxed italic">
            "${item.translation}"
          </p>

          <!-- Counter Actions Bar -->
          <div class="flex items-center justify-between pt-3 border-t border-slate-100">
            <!-- Count Display -->
            <div class="flex items-baseline gap-1">
              <span class="text-2xl font-bold ${isDone ? 'text-emerald-600' : 'text-slate-800'}">${count}</span>
              <span class="text-xs text-slate-400 font-medium">/ ${target}</span>
            </div>

            <!-- Plus & Reset Action Buttons -->
            <div class="flex items-center gap-2">
              <button onclick="resetSingle('${item.id}')" title="Reset Hitungan Ini" class="p-2 text-slate-400 hover:text-red-500 rounded-full hover:bg-slate-100 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              </button>

              <button onclick="increment('${item.id}', ${target})" ${isDone ? 'disabled' : ''} class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-xl transition-all shadow-sm ${
                isDone 
                  ? 'bg-emerald-100 text-emerald-400 cursor-not-allowed' 
                  : 'bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white'
              }">
                +
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      updateOverallProgress();
    }

    document.getElementById('resetAllBtn').addEventListener('click', () => {
      if (confirm('Apakah Anda yakin ingin mengulang semua hitungan?')) {
        userCounts = {};
        saveState();
        render();
      }
    });

    // Initial load
    render();
  </script>
</body>
</html>
