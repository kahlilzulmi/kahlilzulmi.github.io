<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkle Card Button</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animasi Sparkle */
    @keyframes sparkle-fade {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--tw-x)), calc(-50% + var(--tw-y))) scale(1.4) rotate(180deg);
        opacity: 0;
      }
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      animation: sparkle-fade 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <!-- Card Button Component -->
  <button id="sparkleCard" class="relative group overflow-hidden w-full max-w-sm bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-amber-500/50 rounded-2xl p-6 text-left transition-all duration-300 transform active:scale-95 shadow-xl hover:shadow-amber-500/10 cursor-pointer select-none">
    
    <!-- Background Glow Effect -->
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl group-hover:bg-amber-500/20 transition-all"></div>

    <div class="relative z-10 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-amber-500/10 rounded-xl text-amber-400 group-hover:scale-110 transition-transform">
          ✨
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-100">Kirim Dukungan</h3>
          <p class="text-xs text-slate-400">Klik kartu untuk memberi sparkle</p>
        </div>
      </div>

      <!-- Counter Badge -->
      <div class="flex flex-col items-end">
        <span id="counter" class="text-2xl font-extrabold text-amber-400 font-mono transition-transform duration-100">0</span>
        <span class="text-[10px] tracking-wider uppercase text-slate-500 font-semibold">Sparkles</span>
      </div>
    </div>
  </button>

  <script>
    const card = document.getElementById('sparkleCard');
    const counterDisplay = document.getElementById('counter');
    let count = 0;

    // Karakter visual untuk sparkle (bisa campuran bintang/kilauan)
    const sparkleIcons = ['✨', '⭐', '🌟', '💥'];

    card.addEventListener('click', (e) => {
      // 1. Tambah Counter
      count++;
      counterDisplay.textContent = count;

      // Efek bounce ringan pada angka counter
      counterDisplay.classList.add('scale-125');
      setTimeout(() => counterDisplay.classList.remove('scale-125'), 100);

      // 2. Dapatkan koordinat klik terhadap kartu
      const rect = card.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // 3. Buat beberapa partikel sparkle
      const sparkleCount = 8;
      for (let i = 0; i < sparkleCount; i++) {
        createSparkle(clickX, clickY);
      }
    });

    function createSparkle(x, y) {
      const sparkle = document.createElement('span');
      sparkle.className = 'sparkle text-sm select-none';
      
      // Pilih icon acak
      sparkle.textContent = sparkleIcons[Math.floor(Math.random() * sparkleIcons.length)];

      // Posisi awal tepat di titik klik
      sparkle.style.left = `${x}px`;
      sparkle.style.top = `${y}px`;

      // Tentukan arah meletup acak (X dan Y)
      const angle = Math.random() * Math.PI * 2;
      const velocity = 30 + Math.random() * 50; // Jarak lontaran partikel
      const targetX = Math.cos(angle) * velocity;
      const targetY = Math.sin(angle) * velocity;

      sparkle.style.setProperty('--tw-x', `${targetX}px`);
      sparkle.style.setProperty('--tw-y', `${targetY}px`);

      card.appendChild(sparkle);

      // Hapus elemen dari DOM setelah animasi selesai
      setTimeout(() => {
        sparkle.remove();
      }, 700);
    }
  </script>
</body>
</html>
